<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BerraBang HQ – live</title>
<style>
:root{color-scheme:dark;--bg:#07070b;--panel:#0e0e16;--line:#1c1c29;--ink:#f2f2f7;--mute:#a0a0b2;--cyan:#00F5F5;--mag:#FF2EC4;--red:#ff4d5e;--green:#3ee08f}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip}
.app{display:grid;grid-template-columns:minmax(0,1fr) 330px;grid-template-rows:auto minmax(0,1fr);height:100%}
header{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:12px max(2vw,16px);border-bottom:1px solid var(--line)}
header h1{font-size:22px;font-weight:800;margin:0;letter-spacing:-.02em;line-height:1.1}
header h1 b{color:var(--cyan)}
.mode{font-size:13px;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap;font-weight:700}
.mode.live{color:#07070b;background:var(--cyan);border-color:var(--cyan)}
.mode.demo{color:#07070b;background:#ffc94d;border-color:#ffc94d}
.clock{margin-left:auto;font-weight:800;font-size:22px;font-variant-numeric:tabular-nums;white-space:nowrap}
main{display:flex;flex-direction:column;min-height:0}
.bar{display:flex;align-items:center;gap:10px;padding:8px max(2vw,16px);border-bottom:1px solid var(--line)}
.tabs{position:relative;display:flex;gap:6px;overflow-x:auto;flex:1;padding:4px 2px;scrollbar-width:none;overscroll-behavior-x:contain}
.tabs::-webkit-scrollbar{display:none}
button.tab{position:relative;flex:none;min-height:36px;padding:0 15px;border-radius:999px;font-size:14px;color:var(--mute);background:#12121b;border-color:#23233a;white-space:nowrap}
button.tab:hover{color:var(--ink);border-color:var(--acc)}
button.tab[aria-selected="true"]{color:#07070b;background:var(--acc);border-color:var(--acc)}
.dot{position:absolute;top:1px;right:2px;width:10px;height:10px;border-radius:50%;background:var(--green);border:2px solid #07070b;opacity:0;transition:opacity .3s;pointer-events:none}
.dot.on{opacity:1;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.35);background:#b4ffd6}}
button.follow{flex:none;display:flex;align-items:center;gap:8px;min-height:36px;font-size:13px;border-radius:999px;padding:0 13px 0 9px;color:var(--mute);white-space:nowrap}
.sw{width:30px;height:18px;border-radius:9px;background:#2a2a3c;position:relative;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--mute);transition:transform .2s}
button.follow[aria-pressed="true"]{color:var(--cyan);border-color:var(--cyan)}
button.follow[aria-pressed="true"] .sw{background:var(--cyan)}
button.follow[aria-pressed="true"] .sw::after{transform:translateX(12px);background:#07070b}
.floorwrap{position:relative;overflow-x:auto;overflow-y:hidden;flex:1;min-height:0}
.floor{position:relative;min-width:820px;height:100%;min-height:460px}
.floor.room{min-width:0;min-height:0}
.floor canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
aside{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;gap:12px;padding:16px;overflow:hidden}
aside h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:0}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat{background:#15151f;border-radius:10px;padding:7px 11px}
.stat span{display:block;font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat strong{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
ul{list-style:none;margin:0;padding:0}
.wait li{font-size:13px;padding:6px 0 6px 22px;border-bottom:1px solid #16161f;position:relative}
.wait li::before{content:"!";position:absolute;left:0;top:7px;width:16px;height:16px;border-radius:50%;background:#ffc94d;color:#07070b;font-weight:900;font-size:11px;display:grid;place-items:center}
.wait li.empty::before{display:none}.wait li.empty{padding-left:0;color:var(--mute)}
button{font:inherit;font-weight:700;min-height:40px;border-radius:10px;border:1px solid #2a2a3c;background:#16161f;color:var(--ink);cursor:pointer;padding:0 12px}
button:hover{border-color:var(--cyan)}
button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.note{font-size:12.5px;color:var(--mute);margin:0}
.log{flex:1;overflow-y:auto;margin:0;padding:8px 0 0;font-size:13px;border-top:1px solid var(--line);min-height:120px}
.log li{display:grid;grid-template-columns:3.3em minmax(0,1fr);gap:8px;padding:5px 0;border-bottom:1px solid #16161f}
.log time{color:var(--mute);font-variant-numeric:tabular-nums}
.log i{font-style:normal;font-weight:700}
@media(prefers-reduced-motion:reduce){.dot.on{animation:none}.sw::after{transition:none}}
@media(max-width:860px){.app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto;height:auto}.floorwrap{flex:none;height:auto}aside{border-left:0;border-top:1px solid var(--line)}.log{max-height:340px}header h1{font-size:18px}.clock{font-size:18px}.bar{padding:6px 12px;gap:8px}}
@media(max-width:480px){.fl2{display:none}button.follow{padding:0 11px 0 8px}button.tab{padding:0 13px}}
</style>
</head>
<body>
<div class="app">
<header><h1>BerraBang <b>HQ</b> · agentkontoret</h1><span class="mode" id="mode">Ansluter…</span><span class="clock" id="clock">--:--</span></header>
<main>
<div class="bar"><div class="tabs" id="tabs" role="tablist" aria-label="Rum i huset"></div><button class="follow" id="follow" type="button" aria-pressed="false" aria-label="Följ arbetet" title="Byter själv till rummet där det senast hände något"><span class="sw" aria-hidden="true"></span><span class="fl">Följ<span class="fl2"> arbetet</span></span></button></div>
<div class="floorwrap" id="wrap"><div class="floor" id="floor"><canvas id="cv" role="img" aria-label="Kontoret uppifrån: agenterna sitter vid sina skrivbord, går till varandra och lämnar över uppdrag. Händelserna står i loggen."></canvas></div></div>
</main>
<aside>
<h2>Status</h2>
<div class="stats" id="stats"></div>
<h2>Väntar på dig</h2>
<ul class="wait" id="wait"><li class="empty">Inget just nu</li></ul>
<button id="demo" type="button">▶ Visa demo</button>
<p class="note" id="note">Agenterna rör sig när de jobbar på riktigt. Godkännanden gör du i chatten.</p>
<h2>Logg</h2>
<ul class="log" id="log" aria-live="polite"></ul>
</aside>
</div>
<script>
{
"use strict";
/* ---------- hela huset (översikten) ---------- */
const VW=1220,VH=690,CY1=200,CY2=460,AISLES=[40,470,725,915,1140],DOOR={x:16,y:CY2},WALL=1196;
const C={cyan:'#00F5F5',mag:'#FF2EC4',ink:'#f2f2f7',mute:'#a0a0b2',red:'#ff4d5e',green:'#3ee08f',amber:'#ffc94d',blue:'#7fb2ff',purple:'#a48cff'};
const F='Inter,system-ui,sans-serif';
const own=(o,k)=>typeof k==='string'&&Object.prototype.hasOwnProperty.call(o,k)?o[k]:undefined;
const LAYOUT={trend:[110,105,126,70],deep:[255,105,126,70],'res-fakta':[400,105,126,70],'res-gaming':[545,105,126,70],'res-trend':[690,105,126,70],'res-format':[835,105,126,70],'res-rost':[980,105,126,70],ana:[1110,105,112,70],
 manus:[380,330,140,76],vd:[600,330,200,90],rapport:[820,330,140,76],anton:[1010,330,150,76],
 'prod-gta':[95,585,112,70],'prod-fakta':[225,585,112,70],barn:[355,585,112,70],utv:[485,585,112,70],qa:[615,585,112,70],fix:[745,585,112,70],schema:[875,585,112,70],pub:[1005,585,112,70]};
/* lediga platser för nyanställda: först en reservplats nära rätt zon, sedan ett tillbygge (rader under huset, kolumner under rätt zon) */
const SPARE=[[1135,585,112,70,['publicering','kvalitet','studio']],[1143,330,96,76,['ledning','manus','research']]];
const AX=[95,225,355,485,615,745,875,1005,1135],CY3=690,AB=160,TRUNK=20,PREF={studio:[0,1,2,3],kvalitet:[4,5],publicering:[6,7,8]};
const ZONES=[[40,60,1048,'RESEARCH','#FF2EC4'],[40,540,545,'STUDION','#3ee08f'],[555,540,805,'KVALITET','#ffc94d'],[815,540,1062,'PUBLICERING','#7fb2ff']];
const PORTALS={youtube:{y:CY1,label:'YouTube',col:'#ff2a4d'},tiktok:{y:CY2,label:'TikTok',col:'#25f4ee'}};
const STATUS={idle:'',working:'',waiting:'⏸ ',done:'✓ ',failed:'✕ '};
/* ---------- avdelningarnas rum ---------- */
const ROOMS=[{key:'ledning',label:'Ledning',col:C.cyan},{key:'research',label:'Research',col:C.mag},{key:'manus',label:'Manus & rapport',col:C.purple},
 {key:'studio',label:'Studion',col:C.green},{key:'kvalitet',label:'Kvalitet',col:C.amber},{key:'publicering',label:'Publicering',col:C.blue}];
const ROOM=Object.fromEntries(ROOMS.map(r=>[r.key,r]));
const ROOM_BY_ID={vd:'ledning',anton:'ledning',trend:'research',deep:'research',manus:'manus',rapport:'manus','prod-gta':'studio','prod-fakta':'studio',barn:'studio',utv:'studio',qa:'kvalitet',fix:'kvalitet',schema:'publicering',pub:'publicering'};
const ROOM_BY_DEPT={ledning:'ledning',du:'ledning',analys:'ledning',research:'research',innehall:'manus',produktion:'studio',utveckling:'studio',kvalitet:'kvalitet',publicering:'publicering'};
const ORDER=['vd','anton','ana','trend','deep','res-fakta','res-gaming','res-trend','res-format','res-rost','manus','rapport','prod-gta','prod-fakta','barn','utv','qa','fix','schema','pub'];
const roomFor=(id,dept)=>own(ROOM_BY_ID,id)||(id.startsWith('res-')?'research':own(ROOM_BY_DEPT,dept))||'ledning';

const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches,mobile=matchMedia('(max-width:860px)');
const el=id=>document.getElementById(id),cv=el('cv'),ctx=cv.getContext('2d'),floor=el('floor'),wrap=el('wrap'),logEl=el('log'),tabsEl=el('tabs'),followBtn=el('follow');
let now=0,demo=false,demoTimer=0,demoI=0,demoN=0,demoSeeded=false,mode='loading',lastEventTs=0,seq=0,portrait=false,W=VW,H=VH,vs=1,vox=0,voy=0;
let followOn=false,pendingRoom=null,nextSwitch=0,lastAgent=null,dotT=0;
const info=new Map(),waiting=[],statRows=[],early=new Map();
const okCol=c=>{if(typeof c!=='string'||!/^#[0-9a-f]{6}$/i.test(c))return '#8a8aa0';const n=parseInt(c.slice(1),16),r=n>>16,g=n>>8&255,b=n&255,L=(.2126*r+.7152*g+.0722*b)/255;
 if(L>=.15)return c;const t=(.42-L)/(1-L),m=v=>Math.round(v+(255-v)*t).toString(16).padStart(2,'0');return '#'+m(r)+m(g)+m(b)};
const str=(v,n=120)=>typeof v==='string'?v.slice(0,n):(typeof v==='number'?String(v):'');
const pad=n=>String(n).padStart(2,'0');
const hhmm=ts=>{const d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes())};
const font=(w,s)=>{ctx.font=w+' '+s+'px '+F};

/* ---------- världar: en för hela huset + en per rum ---------- */
const worlds=[];
function makeWorld(key,room){const w={key,room,W:VW,H:VH,big:!!room,desks:new Map(),sprites:new Map(),visitors:[],flights:[],bursts:[],portals:null,door:DOOR};worlds.push(w);return w}
const hus=makeWorld('hus',null);
const frontO=d=>d.y>CY2?d.y-d.h/2-18:d.y+d.h/2+18;
const nearest=(list,v)=>list.reduce((b,x)=>Math.abs(x-v)<Math.abs(b-v)?x:b);
const dedupe=pts=>pts.filter((v,i,s)=>!i||v.x!==s[i-1].x||v.y!==s[i-1].y);
hus.lanes=[CY1,CY2];
hus.route=(p,q)=>{const pts=[{x:p.x,y:p.y}];let y1=nearest(hus.lanes,p.y);const y2=nearest(hus.lanes,q.y);pts.push({x:p.x,y:y1});
 if(y1!==y2){
  if(y1<=CY2&&y2<=CY2){const ax=nearest(AISLES,(p.x+q.x)/2);pts.push({x:ax,y:y1},{x:ax,y:y2})}
  else{if(y1===CY1){const ax=nearest(AISLES,p.x);pts.push({x:ax,y:CY1},{x:ax,y:CY2});y1=CY2}
   pts.push({x:TRUNK,y:y1},{x:TRUNK,y:y2===CY1?CY2:y2});
   if(y2===CY1){const ax=nearest(AISLES,q.x);pts.push({x:ax,y:CY2},{x:ax,y:CY1})}}}
 pts.push({x:q.x,y:y2},{x:q.x,y:q.y});return dedupe(pts)};
const annex=new Map();let annexRows=0;
function husSlot(a){
 const L=own(LAYOUT,a.id);if(L)return L;
 const taken=s=>[...hus.desks.values()].some(k=>k.x===s[0]&&k.y===s[1]);
 const sp=SPARE.find(s=>s[4].includes(a.room)&&!taken(s));if(sp)return sp;
 const all=[0,1,2,3,4,5,6,7,8],pref=own(PREF,a.room)||all,free=(r,c)=>!annex.has(r+','+c);let rc=null;
 for(let r=0;r<annexRows&&!rc;r++)for(const c of pref)if(free(r,c)){rc=[r,c];break}
 for(let r=0;r<annexRows&&!rc;r++)for(const c of all)if(free(r,c)){rc=[r,c];break}
 if(!rc)rc=[annexRows,pref[0]];
 annex.set(rc[0]+','+rc[1],a.id);
 if(rc[0]>=annexRows){annexRows=rc[0]+1;hus.H=CY3+annexRows*AB+10;hus.lanes=[CY1,CY2,...Array.from({length:annexRows},(_,i)=>CY3+i*AB)];if(cur===hus)sizeFloor()}
 return [AX[rc[1]],CY3+rc[0]*AB+75,112,70]}
hus.home=s=>({x:s.desk.x,y:frontO(s.desk)});
hus.handoff=(f,t,l)=>husHandoff(hus,f,t,l);
const roomW={};
for(const r of ROOMS){const w=makeWorld(r.key,r);w.route=(p,q)=>roomRoute(w,p,q);w.home=s=>seat(s.desk);w.handoff=(f,t,l)=>roomHandoff(w,f,t,l);roomW[r.key]=w}
let cur=hus;
const seat=d=>d.side==='top'?{x:d.x,y:d.y+d.h/2+22}:d.side==='bot'?{x:d.x,y:d.y-d.h/2-22}:d.side==='left'?{x:d.x+d.w/2+22,y:d.y}:{x:d.x-d.w/2-22,y:d.y};
const spotNear=(w,d)=>{const s=seat(d);return w.dir==='h'?{x:s.x+38,y:s.y}:{x:s.x,y:s.y+34}};
function roomRoute(w,p,q){let pts;
 if(w.dir==='h'){const l1=nearest(w.lanes,p.y),l2=nearest(w.lanes,q.y);pts=[{x:p.x,y:p.y},{x:p.x,y:l1}];if(l1!==l2)pts.push({x:w.aisle,y:l1},{x:w.aisle,y:l2});pts.push({x:q.x,y:l2},{x:q.x,y:q.y})}
 else{const c=w.c;pts=[{x:p.x,y:p.y},{x:c,y:p.y},{x:c,y:q.y},{x:q.x,y:q.y}]}
 return dedupe(pts)}
const mkDesk=(id,x,y,w,h,side)=>({id,x,y,w,h,side,screen:'Väntar…',pct:-1,born:now,inbox:0,stat:'idle'});
const mkSprite=(id,desk,x,y)=>({id,desk,x,y,state:'idle',path:null,then:null,trail:[],card:null,bubble:null,wait:null,q:[],newUntil:0,a:1,fadeTo:1,vis:false,gone:false});
const rank=id=>{const i=ORDER.indexOf(id);if(i>=0)return i;const a=info.get(id);return 100+(a&&typeof a.order==='number'?a.order:50)+(a?a.joined:0)/1000};
const members=w=>[...w.desks.keys()].map(id=>info.get(id)).filter(Boolean);

function layoutRoom(w){
 const ids=[...w.desks.keys()].sort((p,q)=>rank(p)-rank(q)),n=ids.length,pub=w.key==='publicering';
 const put=(id,x,y,dw,dh,side)=>Object.assign(w.desks.get(id),{x,y,w:dw,h:dh,side});
 w.portrait=portrait;
 if(!portrait){
  /* liggande: band med två rader skrivbord kring en gång, max 10 per band; fler band läggs till nedåt */
  const PER=10,bands=Math.max(1,Math.ceil(n/PER)),x0=150,x1=pub?830:950;
  Object.assign(w,{W:1000,H:620+(bands-1)*260,dir:'h',c:372,aisle:70,lanes:[],door:{x:30,y:372},wallR:{x:24,y:44,w:952,h:120}});
  const row=(list,y,side)=>{const k=list.length,sp=Math.min(230,(x1-x0)/Math.max(1,k)),dw=Math.min(190,sp-24),cx=(x0+x1)/2;list.forEach((id,i)=>put(id,cx+(i-(k-1)/2)*sp,y,dw,104,side))};
  for(let b=0;b<bands;b++){const list=ids.slice(b*PER,(b+1)*PER),top=bands===1&&list.length<=3?list.length:Math.ceil(list.length/2),off=b*260;
   row(list.slice(0,top),250+off,'top');row(list.slice(top),494+off,'bot');w.lanes.push(372+off)}
  w.free=n<=3?{x:x0,y:440,w:x1-x0,h:146}:null;
  w.portals=pub?{youtube:{x:w.W-34,y:240,side:'r'},tiktok:{x:w.W-34,y:490,side:'r'}}:null;w.laneEnd=0;
 }else{
  Object.assign(w,{W:440,dir:'v',c:220,wallR:{x:16,y:44,w:408,h:112}});
  ids.forEach((id,i)=>{const y=236+(i>>1)*128;if(i%2)put(id,w.W-95,y,150,96,'right');else put(id,95,y,150,96,'left')});
  const lastB=236+(Math.max(1,Math.ceil(n/2))-1)*128+48,yd=lastB+62;w.door={x:30,y:yd};
  w.portals=pub?{youtube:{x:w.W-30,y:yd,side:'r'},tiktok:{x:w.W-30,y:yd+110,side:'r'}}:null;
  w.laneEnd=pub?yd+110:yd;const base=w.laneEnd+(pub?66:44);
  w.free=n<=3?{x:20,y:base+6,w:w.W-40,h:150}:null;w.H=w.free?w.free.y+w.free.h+24:base+10;
 }
 w.visitors=[];w.flights=[];w.bursts=[];
 for(const s of w.sprites.values()){const h=w.home(s);Object.assign(s,{x:h.x,y:h.y,path:null,then:null,state:'idle',wait:null,card:null,q:[],a:1,fadeTo:1,trail:[]})}
 for(const id of ids)paintDesk(id);
 if(w===cur)sizeFloor()}

/* ---------- agenter ---------- */
function husAdd(a,entering){
 const L=husSlot(a);
 const dk=mkDesk(a.id,L[0],L[1],L[2],L[3]);hus.desks.set(a.id,dk);const h={x:dk.x,y:frontO(dk)};
 const s=mkSprite(a.id,dk,entering?DOOR.x:h.x,entering?DOOR.y:h.y);hus.sprites.set(a.id,s);
 if(entering){s.newUntil=now+9;s.bubble={txt:'Hej allihop!',until:now+2.5};walk(hus,s,h,null)}}
function roomAdd(a,entering){const w=roomW[a.room],dk=mkDesk(a.id,0,0,10,10,'top');w.desks.set(a.id,dk);const s=mkSprite(a.id,dk,0,0);w.sprites.set(a.id,s);layoutRoom(w);
 if(entering){const h=w.home(s);Object.assign(s,{x:w.door.x,y:w.door.y,a:0,fadeTo:1,newUntil:now+9,bubble:{txt:'Hej allihop!',until:now+2.5}});walk(w,s,h,null)}}
function roomRemove(a){const w=roomW[a.room];w.desks.delete(a.id);w.sprites.delete(a.id);layoutRoom(w)}
function setStatus(a,e){a.status=own(STATUS,e.status)!==undefined?e.status:'idle';a.task=str(e.task,80);a.pct=typeof e.progress==='number'?e.progress:null;a.ts=e.ts}
function ensureAgent(id,d,entering){
 id=str(id,40);if(!id||own(PORTALS,id))return null;d=d||{};
 const name=str(d.name,40),ini=str(d.initials,3),role=str(d.role,60),dept=str(d.dept,30);
 let a=info.get(id);
 if(a){if(name)a.name=name;if(ini)a.ini=ini;if(role)a.role=role;if(d.color)a.col=okCol(d.color);if(typeof d.order==='number')a.order=d.order;
  if(dept&&dept!==a.dept){a.dept=dept;const r=roomFor(id,dept);if(r!==a.room){roomRemove(a);a.room=r;roomAdd(a,false)}}return a}
 a={id,name:name||id,ini:ini||(name||id).slice(0,2).toUpperCase(),role,col:okCol(d.color),dept,order:typeof d.order==='number'?d.order:null,room:roomFor(id,dept),status:'idle',task:'',pct:null,ts:0,joined:seq++};
 info.set(id,a);husAdd(a,entering);roomAdd(a,entering);
 const e=early.get(id);if(e){early.delete(id);setStatus(a,e)}

function walk(w,s,to,then){const pts=w.route(s,to),seg=[];let L=0;for(let i=1;i<pts.length;i++){const l=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y);seg.push(l);L+=l}if(!seg.length){seg.push(0);pts.push(pts[0])}

 for(const p of s.trail){const k=now-p.t;if((Math.round(p.x+p.y)%10)>2)continue;ctx.globalAlpha=Math.max(0,.55-k*.5)*A;ctx.fillStyle=col;ctx.beginPath();ctx.arc(p.x,p.y+R-3,1.8,0,7);ctx.fill()}
 ctx.globalAlpha=A;
 if(s.path){ctx.setLineDash([2,8]);ctx.strokeStyle=col+'55';ctx.lineWidth=2;ctx.beginPath();const f=ease(Math.min(1,s.path.t/s.path.dur));for(let k=f;k<=1.0001;k+=.02){const p=posOn(s.path,Math.min(1,k));k===f?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y)}ctx.stroke();ctx.setLineDash([])}
 const working=s.state==='idle'&&!s.vis&&s.desk&&s.desk.pct!==-1,bob=s.state==='walk'&&!reduce?Math.abs(Math.sin(now*12+s.x*.01))*-3:(working&&!reduce?Math.sin(now*9)*.8:0),y=s.y+bob;
 ctx.fillStyle='#0009';ctx.beginPath();ctx.ellipse(s.x,s.y+R,R-3,4,0,0,7);ctx.fill();
 ctx.fillStyle=col;ctx.beginPath();ctx.arc(s.x,y,R,0,7);ctx.fill();ctx.strokeStyle='#ffffff55';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(s.x,y,R,3.6,5.4);ctx.stroke();
 ctx.fillStyle='#07070b';font(800,w.big?12:11);ctx.textAlign='center';ctx.fillText(a.ini,s.x,y+4);
 if(working&&!reduce){ctx.fillStyle=col;for(let i=0;i<3;i++){ctx.globalAlpha=(.3+.7*Math.max(0,Math.sin(now*6-i*.8)))*A;ctx.beginPath();ctx.arc(s.x+R+5+i*6,y-12,2,0,7);ctx.fill()}ctx.globalAlpha=A}
 if(s.state==='walk'||s.state==='pause'||s.vis){font(600,w.big?12:11);const tw=ctx.measureText(a.name).width+10,tx=Math.max(4+tw/2,Math.min(W-4-tw/2,s.x));ctx.fillStyle='#07070bcc';rr(tx-tw/2,y+R+5,tw,16,8);ctx.fill();ctx.fillStyle=C.ink;ctx.fillText(a.name,tx,y+R+17)}
 if(s.newUntil>now){ctx.fillStyle=C.mag;rr(s.x+9,y-R-12,32,16,8);ctx.fill();ctx.fillStyle='#000';font(800,10);ctx.fillText('Ny!',s.x+25,y-R)}
 ctx.textAlign='left';if(s.card)card(s.card,s.x+14,y-R-23,col,w.big);
 if(s.bubble&&s.bubble.until>now){font(600,w.big?13:12);const bw=Math.min(260,ctx.measureText(s.bubble.txt).width+20),by=y-(s.card?R+53:R+41),bx=Math.max(4,Math.min(W-bw-4,s.x-bw/2));ctx.fillStyle=C.ink;rr(bx,by,bw,24,12);ctx.fill();ctx.beginPath();ctx.moveTo(s.x-6,by+23);ctx.lineTo(s.x+6,by+23);ctx.lineTo(s.x,by+31);ctx.fill();ctx.fillStyle='#07070b';ctx.textAlign='center';ctx.fillText(fitText(s.bubble.txt,bw-16),bx+bw/2,by+16);ctx.textAlign='left'}
 ctx.globalAlpha=1}
function draw(){
 ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#07070b';ctx.fillRect(0,0,cv.width,cv.height);ctx.restore();
 const w=cur;W=w.W;H=w.H;
 if(w===hus)drawFloor();else drawRoom(w);
 for(const d of w.desks.values())drawDesk(w,d);
 const order=[...w.sprites.values(),...w.visitors].sort((p,q)=>p.y-q.y);for(const s of order)drawAgent(w,s);
 for(const f of w.flights){const k=ease(Math.min(1,f.t)),x=f.x+(f.tx-f.x)*k,y=f.y+(f.ty-f.y)*k-Math.sin(k*Math.PI)*34;ctx.globalAlpha=f.t>1?Math.max(0,1-(f.t-1)/.3):1;card(f.card,x,y,f.col,w.big);ctx.globalAlpha=1}
 for(const b of w.bursts){const k=b.t/2.4;ctx.globalAlpha=Math.max(0,1-k);font(800,14);ctx.textAlign='center';ctx.fillStyle=b.col;ctx.fillText(b.label,Math.max(70,Math.min(W-70,b.x)),b.y-k*50);ctx.textAlign='left';ctx.globalAlpha=1}
 const h=new Date().getHours(),night=h>=19||h<6?.2:0;if(night){ctx.fillStyle='rgba(8,8,40,'+night+')';rr(0,0,W,H,18);ctx.fill()}}
function tickSprite(s,dt){
 if(s.state==='walk'){s.path.t+=dt;const f=Math.min(1,s.path.t/s.path.dur),p=posOn(s.path,ease(f));s.x=p.x;s.y=p.y;if(!reduce&&s.a>.5)s.trail.push({x:s.x,y:s.y,t:now});
  if(f>=1){s.path=null;s.state='idle';const fn=s.then;s.then=null;if(fn)fn();else if(!s.vis)paintDesk(s.id)}}
 if(s.trail.length)s.trail=s.trail.filter(p=>now-p.t<1.1);
 if((s.state==='pause'||s.state==='away')&&now>=s.wait.until){const fn=s.wait.fn;s.wait=null;s.state='idle';fn()}
 s.a+=(s.fadeTo-s.a)*Math.min(1,dt*(reduce?60:5))}
function tickWorld(w,dt){
 for(const s of w.sprites.values())tickSprite(s,dt);for(const v of w.visitors)tickSprite(v,dt);
 if(w.visitors.some(v=>v.gone))w.visitors=w.visitors.filter(v=>!v.gone);
 for(const f of w.flights){f.t+=dt*2.2;if(f.t>=1&&!f.landed){f.landed=true;f.done()}}
 for(let i=w.flights.length-1;i>=0;i--)if(w.flights[i].t>1.3)w.flights.splice(i,1);
 for(const b of w.bursts)b.t+=dt;for(let i=w.bursts.length-1;i>=0;i--)if(w.bursts[i].t>2.4)w.bursts.splice(i,1)}

/* ---------- flikar, storlek, följ arbetet ---------- */
function fit(){const w=cur,r=floor.getBoundingClientRect(),d=devicePixelRatio||1,s=Math.min(r.width/w.W,r.height/w.H);cv.width=Math.round(r.width*d);cv.height=Math.round(r.height*d);
 vs=s;vox=(r.width-w.W*s)/2;voy=(r.height-w.H*s)/2;ctx.setTransform(d*s,0,0,d*s,d*vox,d*voy)}
function sizeFloor(){const room=cur!==hus;floor.classList.toggle('room',room);
 if(mobile.matches){const fw=room?wrap.clientWidth:Math.max(820,wrap.clientWidth),h=fw*cur.H/cur.W;floor.style.height=Math.round(room?h:Math.max(innerHeight*.62,h))+'px'}else floor.style.height='';fit()}
function checkOrient(){const p=wrap.clientWidth<620;if(p!==portrait){portrait=p;for(const r of ROOMS)layoutRoom(roomW[r.key])}sizeFloor();if(tabBtns[cur.key])showTab()}
const tabBtns={};
for(const r of [{key:'hus',label:'Hela huset',col:C.ink},...ROOMS]){const b=document.createElement('button');b.type='button';b.className='tab';b.setAttribute('role','tab');b.setAttribute('aria-controls','floor');b.style.setProperty('--acc',r.col);b.textContent=r.label;
 const d=document.createElement('span');d.className='dot';d.setAttribute('aria-hidden','true');b.append(d);b.addEventListener('click',()=>setView(r.key,true));tabsEl.append(b);tabBtns[r.key]={btn:b,dot:d,label:r.label,on:false}}
tabsEl.addEventListener('keydown',e=>{if(e.key!=='ArrowRight'&&e.key!=='ArrowLeft')return;const keys=Object.keys(tabBtns),i=keys.indexOf(cur.key),j=(i+(e.key==='ArrowRight'?1:-1)+keys.length)%keys.length;setView(keys[j],true);tabBtns[keys[j]].btn.focus();e.preventDefault()});
function save(){try{localStorage.setItem('bbhq-office',JSON.stringify({view:cur.key,follow:followOn}))}catch(e){}}
function setView(key,manual){const w=key==='hus'?hus:roomW[key];if(!w)return;const was=cur;cur=w;
 for(const k in tabBtns){const b=tabBtns[k].btn;b.setAttribute('aria-selected',k===key?'true':'false');b.tabIndex=k===key?0:-1}
 nextSwitch=now+(manual?12:4);sizeFloor();
 if(w===hus&&was!==hus)wrap.scrollLeft=(wrap.scrollWidth-wrap.clientWidth)/2;
 const n=w.desks.size;cv.setAttribute('aria-label',w===hus?'Hela huset uppifrån: alla agenter vid sina skrivbord. Tryck på ett skrivbord för att gå in i det rummet. Händelserna står i loggen.':w.room.label+' uppifrån: '+n+(n===1?' agent':' agenter')+' vid sina skrivbord. Agenter från andra rum kommer in genom dörren. Händelserna står i loggen.');
 showTab();save()}
function showTab(){const b=tabBtns[cur.key].btn;if(b.offsetLeft<tabsEl.scrollLeft)tabsEl.scrollLeft=b.offsetLeft-8;else if(b.offsetLeft+b.offsetWidth>tabsEl.scrollLeft+tabsEl.clientWidth)tabsEl.scrollLeft=b.offsetLeft+b.offsetWidth-tabsEl.clientWidth+8}
function updateDots(){const any=worlds.some(worldBusy);for(const w of worlds){const t=tabBtns[w.key],on=w===hus?any:worldBusy(w);if(on!==t.on){t.on=on;t.dot.classList.toggle('on',on);t.btn.setAttribute('aria-label',t.label+(on?', aktivitet pågår':''))}}}
followBtn.addEventListener('click',()=>{followOn=!followOn;followBtn.setAttribute('aria-pressed',String(followOn));if(followOn&&lastAgent){const a=info.get(lastAgent);if(a&&a.room!==cur.key)setView(a.room,false)}save()});
function hit(ev){const r=cv.getBoundingClientRect(),x=(ev.clientX-r.left-vox)/vs,y=(ev.clientY-r.top-voy)/vs;
 if(cur===hus){for(const d of hus.desks.values())if(Math.abs(x-d.x)<=d.w/2+4&&y>=d.y-d.h/2-4&&y<=d.y+d.h/2+34){const a=info.get(d.id);return a?a.room:null}return null}
 return Math.hypot(x-cur.door.x,y-cur.door.y)<56?'hus':null}
cv.addEventListener('click',ev=>{const k=hit(ev);if(k)setView(k,true)});
cv.addEventListener('mousemove',ev=>{cv.style.cursor=hit(ev)?'pointer':''});
const tickClock=()=>{const d=new Date();el('clock').textContent=pad(d.getHours())+':'+pad(d.getMinutes())};tickClock();setInterval(tickClock,1000);

/* ---------- start ---------- */
checkOrient();
{let p={};try{p=JSON.parse(localStorage.getItem('bbhq-office')||'{}')||{}}catch(e){p={}}
 followOn=p.follow===true;followBtn.setAttribute('aria-pressed',String(followOn));setView(typeof p.view==='string'&&(p.view==='hus'||own(roomW,p.view))?p.view:'hus',false)}
if(cur===hus)wrap.scrollLeft=(wrap.scrollWidth-wrap.clientWidth)/2;
new ResizeObserver(fit).observe(floor);
new ResizeObserver(()=>requestAnimationFrame(checkOrient)).observe(wrap);
let last=performance.now();
function frame(t){const dt=Math.min(.05,Math.max(0,(t-last)/1000));last=t;now+=dt;for(const w of worlds)tickWorld(w,dt);
 if(pendingRoom&&now>=nextSwitch){if(pendingRoom!==cur.key)setView(pendingRoom,false);pendingRoom=null}
 if(now-dotT>.3){dotT=now;updateDots()}
 draw();requestAnimationFrame(frame)}
requestAnimationFrame(frame);

/* ---------- data: teamets riktiga händelser ---------- */
(async()=>{
 let db=null;try{db=window.claude&&window.claude.use?await window.claude.use('db'):null}catch(e){db=null}
 if(!db){setMode('offline');el('note').textContent='Kunde inte nå teamets data här, så en demo visas.';startDemo();return}
 const seen=new Set();let first=true;
 const timer=setTimeout(()=>{if(first)el('note').textContent='Teamets data svarar inte än, försöker igen…'},10000);
 db.collection('agents').onSnapshot(snap=>{for(const d of snap.docs)if(d.exists)ensureAgent(d.id,d.data()||{},false);for(const a of info.values())paintDesk(a.id);refreshMode()},()=>{});
 db.collection('events').orderBy('ts','desc').limit(300).onSnapshot(snap=>{
  if(!snap.metadata.fromCache)clearTimeout(timer);
  const fresh=[];for(const d of snap.docs){if(!d.exists||seen.has(d.id))continue;seen.add(d.id);const e=Object.assign({},d.data());if(typeof e.ts==='number')fresh.push(e)}
  fresh.sort((a,b)=>a.ts-b.ts);for(const e of fresh)apply(e,!first||Date.now()-e.ts<90e3);
  if(first&&!snap.size&&!info.size)el('note').textContent='Inget i teamets logg än.';
  first=false;refreshMode()},()=>{setMode('offline')});
 setInterval(refreshMode,20e3);
})();
}
