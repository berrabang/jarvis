<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BerraBang HQ – live</title>
<style>
:root{color-scheme:dark;--bg:#07070b;--panel:#0e0e16;--line:#1c1c29;--ink:#f2f2f7;--mute:#a0a0b2;--cyan:#00F5F5;--mag:#FF2EC4;--red:#ff4d5e}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip}
.app{display:grid;grid-template-columns:minmax(0,1fr) 330px;grid-template-rows:auto minmax(0,1fr);height:100%}
header{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:12px max(2vw,16px);border-bottom:1px solid var(--line)}
header h1{font-size:22px;font-weight:800;margin:0;letter-spacing:-.02em;line-height:1.1}
header h1 b{color:var(--cyan)}
.mode{font-size:13px;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap;font-weight:700}
.mode.live{color:#07070b;background:var(--cyan);border-color:var(--cyan)}
.mode.demo{color:#07070b;background:#ffc94d;border-color:#ffc94d}
.clock{margin-left:auto;font-weight:800;font-size:22px;font-variant-numeric:tabular-nums;white-space:nowrap}
.floorwrap{position:relative;overflow-x:auto;overflow-y:hidden}
.floor{position:relative;min-width:820px;height:100%;min-height:460px}
.floor canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
aside{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;gap:12px;padding:16px;overflow:hidden}
aside h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:0}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat{background:#15151f;border-radius:10px;padding:7px 11px}
.stat span{display:block;font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat strong{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
ul{list-style:none;margin:0;padding:0}
.wait li{font-size:13px;padding:6px 0 6px 22px;border-bottom:1px solid #16161f;position:relative}
.wait li::before{content:"!";position:absolute;left:0;top:7px;width:16px;height:16px;border-radius:50%;background:#ffc94d;color:#07070b;font-weight:900;font-size:11px;display:grid;place-items:center}
.wait li.empty::before{display:none}.wait li.empty{padding-left:0;color:var(--mute)}
button{font:inherit;font-weight:700;min-height:40px;border-radius:10px;border:1px solid #2a2a3c;background:#16161f;color:var(--ink);cursor:pointer;padding:0 12px}
button:hover{border-color:var(--cyan)}
button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.note{font-size:12.5px;color:var(--mute);margin:0}
.log{flex:1;overflow-y:auto;margin:0;padding:8px 0 0;font-size:13px;border-top:1px solid var(--line);min-height:120px}
.log li{display:grid;grid-template-columns:3.3em minmax(0,1fr);gap:8px;padding:5px 0;border-bottom:1px solid #16161f}
.log time{color:var(--mute);font-variant-numeric:tabular-nums}
.log i{font-style:normal;font-weight:700}
@media(max-width:860px){.app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 62vh auto;height:auto}aside{border-left:0;border-top:1px solid var(--line)}.log{max-height:340px}header h1{font-size:18px}.clock{font-size:18px}}
</style>
</head>
<body>
<div class="app">
<header><h1>BerraBang <b>HQ</b> · agentkontoret</h1><span class="mode" id="mode">Ansluter…</span><span class="clock" id="clock">--:--</span></header>
<div class="floorwrap"><div class="floor" id="floor"><canvas id="cv" role="img" aria-label="Kontoret uppifrån: agenterna sitter vid sina skrivbord, går till varandra och lämnar över uppdrag. Händelserna står i loggen."></canvas></div></div>
<aside>
<h2>Status</h2>
<div class="stats" id="stats"></div>
<h2>Väntar på dig</h2>
<ul class="wait" id="wait"><li class="empty">Inget just nu</li></ul>
<button id="demo" type="button">▶ Visa demo</button>
<p class="note" id="note">Agenterna rör sig när de jobbar på riktigt. Godkännanden gör du i chatten.</p>
<h2>Logg</h2>
<ul class="log" id="log" aria-live="polite"></ul>
</aside>
</div>
<script>
{
"use strict";
/* ---------- värld ---------- */
const VW=1220,VH=690,CY1=200,CY2=460,AISLES=[40,470,725,915,1140],DOOR={x:16,y:CY2},WALL=1196;
const C={cyan:'#00F5F5',mag:'#FF2EC4',ink:'#f2f2f7',mute:'#a0a0b2',red:'#ff4d5e',green:'#3ee08f',amber:'#ffc94d'};
const LAYOUT={trend:[110,105,126,70],deep:[255,105,126,70],'res-fakta':[400,105,126,70],'res-gaming':[545,105,126,70],'res-trend':[690,105,126,70],'res-format':[835,105,126,70],'res-rost':[980,105,126,70],ana:[1110,105,112,70],
 manus:[380,330,140,76],vd:[600,330,200,90],rapport:[820,330,140,76],anton:[1010,330,150,76],
 'prod-gta':[95,585,112,70],'prod-fakta':[225,585,112,70],barn:[355,585,112,70],utv:[485,585,112,70],qa:[615,585,112,70],fix:[745,585,112,70],schema:[875,585,112,70],pub:[1005,585,112,70]};
const SPARE=[[1135,585,112,70]];
const ZONES=[[40,60,1048,'RESEARCH','#FF2EC4'],[40,540,545,'STUDION','#3ee08f'],[555,540,805,'KVALITET','#ffc94d'],[815,540,1062,'PUBLICERING','#7fb2ff']];
const PORTALS={youtube:{y:CY1,label:'YouTube',col:'#ff2a4d'},tiktok:{y:CY2,label:'TikTok',col:'#25f4ee'}};
const STATUS={idle:'',working:'',waiting:'⏸ ',done:'✓ ',failed:'✕ '};
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),floor=document.getElementById('floor');
const fit=()=>{const r=floor.getBoundingClientRect(),d=devicePixelRatio||1,s=Math.min(r.width/VW,r.height/VH);cv.width=Math.round(r.width*d);cv.height=Math.round(r.height*d);ctx.setTransform(d*s,0,0,d*s,d*(r.width-VW*s)/2,d*(r.height-VH*s)/2)};
new ResizeObserver(fit).observe(floor);
let now=0,demo=false,demoTimer=0,mode='loading',lastEventTs=0;
const desks=new Map(),agents=new Map(),flights=[],bursts=[],waiting=[];
const okCol=c=>typeof c==='string'&&/^#[0-9a-f]{6}$/i.test(c)?c:'#8a8aa0';
const str=(v,n=120)=>typeof v==='string'?v.slice(0,n):(typeof v==='number'?String(v):'');
const front=d=>d.y>CY2?d.y-d.h/2-18:d.y+d.h/2+18;
const laneOf=y=>y<=CY1?CY1:CY2;
const el=id=>document.getElementById(id),logEl=el('log');
const pad=n=>String(n).padStart(2,'0');
const hhmm=ts=>{const d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes())};

/* ---------- skrivbord + agenter ---------- */
function ensureAgent(id,d,entering){
 id=str(id,40);if(!id||PORTALS[id])return null;
 let a=agents.get(id);
 const name=str(d&&d.name,40),ini=str(d&&d.initials,3),role=str(d&&d.role,60);
 if(a){if(name)a.name=name;if(ini)a.ini=ini;if(role)a.role=role;if(d&&d.color)a.col=okCol(d.color);return a}
 let L=LAYOUT[id];if(!L){L=SPARE.find(s=>![...desks.values()].some(k=>k.x===s[0]&&k.y===s[1]));if(!L)return null}
 const dk={id,x:L[0],y:L[1],w:L[2],h:L[3],screen:'Väntar…',pct:-1,born:now,inbox:0,stat:'idle'};desks.set(id,dk);
 a={id,name:name||id,ini:ini||(name||id).slice(0,2).toUpperCase(),role,col:okCol(d&&d.color),desk:dk,x:entering?DOOR.x:dk.x,y:entering?DOOR.y:front(dk),
  state:'idle',path:null,trail:[],card:null,bubble:null,wait:null,q:[],newUntil:entering?now+9:0,status:'idle',task:'',pct:null,ts:0};
 agents.set(id,a);paintDesk(a);if(entering){a.bubble={txt:'Hej allihop!',until:now+2.5};walk(a,home(a),null)}
 return a}
const home=a=>({x:a.desk.x,y:front(a.desk)});
function route(p,q){const pts=[{x:p.x,y:p.y}],y1=laneOf(p.y),y2=laneOf(q.y);pts.push({x:p.x,y:y1});
 if(y1!==y2){const m=(p.x+q.x)/2,ax=AISLES.reduce((b,v)=>Math.abs(v-m)<Math.abs(b-m)?v:b);pts.push({x:ax,y:y1},{x:ax,y:y2})}
 pts.push({x:q.x,y:y2},{x:q.x,y:q.y});return pts.filter((v,i,s)=>!i||v.x!==s[i-1].x||v.y!==s[i-1].y)}
function walk(a,to,then){const pts=route(a,to),seg=[];let L=0;for(let i=1;i<pts.length;i++){const l=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y);seg.push(l);L+=l}if(!seg.length){seg.push(0);pts.push(pts[0])}a.path={pts,seg,L,t:0,dur:Math.max(.6,L/170)};a.state='walk';a.then=then}
function posOn(p,f){let d=f*p.L;for(let i=0;i<p.seg.length;i++){if(d<=p.seg[i]||i===p.seg.length-1){const k=p.seg[i]?Math.min(1,d/p.seg[i]):1;return{x:p.pts[i].x+(p.pts[i+1].x-p.pts[i].x)*k,y:p.pts[i].y+(p.pts[i+1].y-p.pts[i].y)*k}}d-=p.seg[i]}return p.pts[p.pts.length-1]}
const ease=t=>t<.5?2*t*t:1-((-2*t+2)**2)/2;

/* ---------- överlämning ---------- */
function handoff(fromId,toId,label){
 const a=agents.get(fromId);if(!a)return;
 if(a.state!=='idle'){if(a.q.length<6)a.q.push([toId,label]);return}
 const portal=PORTALS[toId],to=portal?null:desks.get(toId);
 if(!portal&&(!to||toId===fromId))return;
 const spot=portal?{x:WALL-26,y:portal.y}:{x:to.x+30,y:front(to)};
 a.card=label||'Uppdrag';a.desk.screen='Går till '+(portal?portal.label:(agents.get(toId)||{}).name||toId);a.desk.pct=-1;
 walk(a,spot,()=>{
  a.bubble={txt:portal?'Ut på '+portal.label+'!':'Här: '+(label||'uppdrag'),until:now+2.2};
  if(portal)bursts.push({x:WALL-70,y:portal.y-28,t:0,label:'↑ '+portal.label,col:portal.col});
  else flights.push({card:a.card,col:a.col,x:a.x+14,y:a.y-30,tx:to.x+to.w/2-18,ty:to.y-to.h/2+4,t:0,done:()=>{to.inbox++;setTimeout(()=>{to.inbox=Math.max(0,to.inbox-1)},15000)}});
  a.card=null;a.state='pause';a.wait={until:now+.8,fn:()=>walk(a,home(a),()=>{a.state='idle';paintDesk(a);const n=a.q.shift();if(n)handoff(a.id,n[0],n[1])})}})}

/* ---------- händelser ---------- */
function paintDesk(a){if(a.state==='walk'||a.state==='pause')return;const d=a.desk,dm=demo&&a.dstatus;
 const s=dm?a.dstatus:a.status,t=dm?a.dtask:a.task,p=dm?a.dpct:a.pct;
 d.stat=s;d.screen=(s==='idle'&&!t)?(a.role||'Väntar…'):(STATUS[s]||'')+(t||a.role||'');d.pct=s==='working'?(typeof p==='number'?Math.max(0,Math.min(100,p)):-2):-1}
function log(who,col,txt,ts){if(logEl.firstElementChild&&logEl.firstElementChild.dataset.empty)logEl.textContent='';
 const li=document.createElement('li'),t=document.createElement('time'),s=document.createElement('span'),b=document.createElement('i');
 t.textContent=hhmm(ts||Date.now());b.style.color=col;b.textContent=who+' ';s.append(b,document.createTextNode(txt));li.append(t,s);logEl.prepend(li);while(logEl.children.length>60)logEl.lastChild.remove()}
const nameOf=id=>PORTALS[id]?PORTALS[id].label:((agents.get(id)||{}).name||str(id,30));
function apply(e,animate){
 if(!e||typeof e.ts!=='number')return;lastEventTs=Math.max(lastEventTs,e.ts);
 if(e.kind==='stats'){renderStats(e);return}
 if(e.kind==='hire'){const a=ensureAgent(e.agent,e,animate);if(a)log(a.name,a.col,'anställs: '+str(e.role),e.ts);return}
 const a=agents.get(str(e.agent,40));if(!a)return;
 if(e.kind==='status'&&e.ts>=a.ts){a.status=STATUS[e.status]!==undefined?e.status:'idle';a.task=str(e.task,80);a.pct=typeof e.progress==='number'?e.progress:null;a.ts=e.ts;paintDesk(a);
  log(a.name,a.col,({working:'jobbar: ',waiting:'väntar: ',done:'klar: ',failed:'fel: ',idle:''}[a.status]||'')+a.task+(typeof e.progress==='number'&&a.status==='working'?' ('+e.progress+' %)':''),e.ts)}
 else if(e.kind==='handoff'){a.ts=Math.max(a.ts,e.ts);log(a.name,a.col,'→ '+nameOf(str(e.to,40))+': '+str(e.task,80),e.ts);if(animate)handoff(a.id,str(e.to,40),str(e.task,60))}
 else if(e.kind==='note')log(a.name,a.col,str(e.text||e.task),e.ts)}
function renderStats(e){
 const box=el('stats');box.textContent='';const c=e.counters&&typeof e.counters==='object'?e.counters:{};
 for(const k of Object.keys(c).slice(0,8)){const d=document.createElement('div');d.className='stat';const s=document.createElement('span');s.textContent=str(k,40);const v=document.createElement('strong');v.textContent=str(c[k],14);d.append(s,v);box.append(d)}
 waiting.length=0;if(Array.isArray(e.waiting))for(const w of e.waiting.slice(0,8))waiting.push(str(w,120));
 const ul=el('wait');ul.textContent='';if(!waiting.length){const li=document.createElement('li');li.className='empty';li.textContent='Inget just nu';ul.append(li)}
 for(const w of waiting){const li=document.createElement('li');li.textContent=w;ul.append(li)}}
function setMode(m){mode=m;const x=el('mode');x.className='mode'+(m==='live'?' live':m==='demo'?' demo':'');
 x.textContent={live:'● Live',idle:'Vilar',demo:'Demo',loading:'Ansluter…',offline:'Offline'}[m]||m;el('demo').textContent=demo?'■ Stoppa demo':'▶ Visa demo'}
function refreshMode(){if(demo){setMode('demo');return}if(mode==='offline')return;
 const active=[...agents.values()].some(a=>(a.status==='working'&&Date.now()-a.ts<45*60e3)||a.state!=='idle');
 setMode(active||Date.now()-lastEventTs<10*60e3?'live':'idle')}

/* ---------- demo ---------- */
const FLOW=[['trend','vd','Idé: GTA 5-NPC'],['vd','manus','Skriv manus'],['manus','prod-gta','Manus v1'],['prod-gta','qa','Video klar'],['qa','fix','Underkänd: fel fakta'],['fix','qa','Fixad, kolla igen'],['qa','schema','Godkänd ✓'],['schema','pub','Först ut: 17:00'],['pub','anton','Godkänn?'],['anton','pub','Ja ✓'],['pub','youtube','Short'],['pub','tiktok','Video'],['deep','vd','Djupdyk: rymden'],['ana','vd','Kvällsrapport']];
let demoI=0;
function demoTick(){for(let k=0;k<FLOW.length;k++){const f=FLOW[demoI++%FLOW.length],a=agents.get(f[0]);if(!a||a.state!=='idle'||(!agents.has(f[1])&&!PORTALS[f[1]]))continue;
  a.dstatus='working';a.dtask=f[2];a.dpct=Math.round(30+Math.random()*60);paintDesk(a);const t=agents.get(f[1]);
  setTimeout(()=>{if(demo&&t){t.dstatus='working';t.dtask=f[2];t.dpct=15;paintDesk(t)}},3000);
  log(a.name,a.col,'→ '+nameOf(f[1])+': '+f[2]+' (demo)');handoff(f[0],f[1],f[2]);break}}
function seedDemo(){if(agents.size)return;[['vd','Jarvis','J','#00F5F5'],['trend','Trendspanare','TS','#FF2EC4'],['deep','Djupdyk','DD','#db2777'],['manus','Manusförfattare','MF','#a48cff'],['prod-gta','Producent GTA','PG','#3ee08f'],['qa','Kvalitetsgranskare','QA','#ffc94d'],['fix','Fixaren','FX','#ff8a3d'],['schema','Schemaläggare','SC','#38bdf8'],['pub','Publicerare','PU','#ff7aa8'],['ana','Analytiker','AN','#7fb2ff'],['anton','Anton','A','#f43f5e']].forEach(r=>ensureAgent(r[0],{name:r[1],initials:r[2],color:r[3]}))}
function startDemo(){demo=true;seedDemo();clearInterval(demoTimer);demoTimer=setInterval(demoTick,2300);demoTick();refreshMode()}
function stopDemo(){demo=false;clearInterval(demoTimer);for(const a of agents.values()){a.dstatus=null;paintDesk(a)}refreshMode()}
el('demo').addEventListener('click',()=>demo?stopDemo():startDemo());

/* ---------- rita ---------- */
function rr(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h)}
function fitText(t,w){t=String(t);if(ctx.measureText(t).width<=w)return t;while(t.length>1&&ctx.measureText(t+'…').width>w)t=t.slice(0,-1);return t+'…'}
function card(t,x,y,col){ctx.font='700 11px Inter,sans-serif';const w=Math.min(210,ctx.measureText(t).width+18);ctx.shadowColor=col;ctx.shadowBlur=reduce?0:16;ctx.fillStyle='#10101a';rr(x,y,w,22,6);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle=col;ctx.lineWidth=1.5;ctx.stroke();ctx.fillStyle=C.ink;ctx.textAlign='left';ctx.fillText(fitText(t,w-14),x+8,y+15)}
function drawFloor(){
 ctx.fillStyle='#0b0b12';rr(0,0,VW,VH,18);ctx.fill();
 ctx.strokeStyle='#12121b';ctx.lineWidth=1;ctx.beginPath();for(let x=40;x<VW;x+=40){ctx.moveTo(x,0);ctx.lineTo(x,VH)}for(let y=40;y<VH;y+=40){ctx.moveTo(0,y);ctx.lineTo(VW,y)}ctx.stroke();
 for(const [x0,y0,x1,lbl,col] of ZONES){ctx.fillStyle=col+'0d';rr(x0,y0,x1-x0,92,12);ctx.fill();ctx.fillStyle=col+'aa';ctx.font='800 11px Inter,sans-serif';ctx.textAlign='left';ctx.fillText(lbl,x0+10,y0<300?y0-8:y0+108)}
 const corridor=()=>{ctx.beginPath();for(const y of[CY1,CY2]){ctx.moveTo(40,y);ctx.lineTo(WALL,y)}for(const x of AISLES){ctx.moveTo(x,CY1);ctx.lineTo(x,CY2)}ctx.moveTo(0,CY2);ctx.lineTo(40,CY2);ctx.stroke()};
 ctx.lineCap='round';ctx.strokeStyle='#15151f';ctx.lineWidth=22;corridor();ctx.strokeStyle='#ffffff0c';ctx.lineWidth=1;ctx.setLineDash([6,10]);corridor();ctx.setLineDash([]);ctx.lineCap='butt';
 ctx.fillStyle=C.mag;ctx.fillRect(0,CY2-24,5,48);ctx.fillStyle=C.mute;ctx.font='600 12px Inter,sans-serif';ctx.textAlign='left';ctx.fillText('Entré',12,CY2-30);
 for(const k in PORTALS){const p=PORTALS[k],g=reduce?0:.5+.5*Math.sin(now*2.4+(k==='tiktok'?1.5:0));ctx.fillStyle=p.col;ctx.shadowColor=p.col;ctx.shadowBlur=10+g*14;ctx.fillRect(WALL,p.y-30,7,60);ctx.shadowBlur=0;
  ctx.font='800 12px Inter,sans-serif';ctx.textAlign='right';ctx.fillText(p.label+' ↗',WALL-8,p.y+46);ctx.textAlign='left'}
 board(60,262,230,136,'Att godkänna',waiting.slice(0,5),'Inget väntar på dig');
 ctx.fillStyle='#ffffff09';ctx.font='800 46px Inter,sans-serif';ctx.textAlign='left';ctx.fillText('BERRABANG',24,VH-14)}
function board(x,y,w,h,title,rows,empty){ctx.fillStyle='#101019';rr(x,y,w,h,10);ctx.fill();ctx.strokeStyle=rows.length?'#5a4a1c':'#23233a';ctx.lineWidth=1;ctx.stroke();
 ctx.fillStyle=rows.length?C.amber:C.mute;ctx.font='700 12px Inter,sans-serif';ctx.textAlign='left';ctx.fillText(title+(rows.length?' ('+rows.length+')':''),x+12,y+20);
 ctx.font='500 12px Inter,sans-serif';if(!rows.length){ctx.fillStyle='#5c5c70';ctx.fillText(empty,x+12,y+44)}
 rows.forEach((t,i)=>{const ly=y+42+i*20;ctx.fillStyle=C.amber;ctx.beginPath();ctx.arc(x+16,ly-4,3.5,0,7);ctx.fill();ctx.fillStyle=C.ink;ctx.fillText(fitText(t,w-40),x+28,ly)})}
function drawDesk(dk){const a=agents.get(dk.id),col=a?a.col:'#8a8aa0',lit=dk.pct!==-1,st=dk.stat;ctx.globalAlpha=Math.min(1,(now-dk.born)/1.2);
 const x=dk.x-dk.w/2,y=dk.y-dk.h/2;
 ctx.fillStyle='#00000066';rr(x+4,y+6,dk.w,dk.h,12);ctx.fill();
 ctx.fillStyle=dk.id==='vd'?'#141a26':'#15151f';rr(x,y,dk.w,dk.h,12);ctx.fill();ctx.lineWidth=2;ctx.strokeStyle=st==='failed'?C.red:col+(lit?'':'88');ctx.stroke();
 if(lit&&!reduce){ctx.shadowColor=col;ctx.shadowBlur=12}
 ctx.fillStyle='#05060a';rr(x+8,y+8,dk.w-16,dk.h-34,6);ctx.fill();ctx.shadowBlur=0;
 ctx.fillStyle=st==='done'?C.green:st==='waiting'?C.amber:st==='failed'?C.red:(lit?col:'#7c7c92');ctx.font='500 11px Inter,sans-serif';ctx.textAlign='left';ctx.fillText(fitText(dk.screen,dk.w-26),x+13,y+24);
 if(lit){ctx.fillStyle='#24243a';ctx.fillRect(x+13,y+30,dk.w-26,3);ctx.fillStyle=col;const p=dk.pct>=0?dk.pct/100:(.5+.5*Math.sin(now*3))*.9;ctx.fillRect(x+13,y+30,(dk.w-26)*p,3)}
 ctx.fillStyle=C.ink;ctx.font='700 12px Inter,sans-serif';ctx.fillText(fitText(a?a.name:'',dk.w-20),x+10,y+dk.h-9);
 if(dk.inbox){ctx.fillStyle=C.mag;ctx.beginPath();ctx.arc(x+dk.w-8,y,10,0,7);ctx.fill();ctx.fillStyle='#000';ctx.font='800 11px Inter,sans-serif';ctx.textAlign='center';ctx.fillText(dk.inbox,x+dk.w-8,y+4);ctx.textAlign='left'}
 ctx.globalAlpha=1}
function drawAgent(a){const col=a.col;
 for(const p of a.trail){const k=now-p.t;if((Math.round(p.x+p.y)%10)>2)continue;ctx.globalAlpha=Math.max(0,.55-k*.5);ctx.fillStyle=col;ctx.beginPath();ctx.arc(p.x,p.y+12,1.8,0,7);ctx.fill()}ctx.globalAlpha=1;
 if(a.path){ctx.setLineDash([2,8]);ctx.strokeStyle=col+'55';ctx.lineWidth=2;ctx.beginPath();const f=ease(Math.min(1,a.path.t/a.path.dur));for(let k=f;k<=1.0001;k+=.02){const p=posOn(a.path,Math.min(1,k));k===f?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y)}ctx.stroke();ctx.setLineDash([])}
 const working=a.state==='idle'&&a.desk.pct!==-1,bob=a.state==='walk'&&!reduce?Math.abs(Math.sin(now*12+a.x*.01))*-3:(working&&!reduce?Math.sin(now*9)*.8:0),y=a.y+bob;
 ctx.fillStyle='#0009';ctx.beginPath();ctx.ellipse(a.x,a.y+15,12,4,0,0,7);ctx.fill();
 ctx.fillStyle=col;ctx.beginPath();ctx.arc(a.x,y,15,0,7);ctx.fill();ctx.strokeStyle='#ffffff55';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(a.x,y,15,3.6,5.4);ctx.stroke();
 ctx.fillStyle='#07070b';ctx.font='800 11px Inter,sans-serif';ctx.textAlign='center';ctx.fillText(a.ini,a.x,y+4);
 if(working&&!reduce){ctx.fillStyle=col;for(let i=0;i<3;i++){ctx.globalAlpha=.3+.7*Math.max(0,Math.sin(now*6-i*.8));ctx.beginPath();ctx.arc(a.x+20+i*6,y-12,2,0,7);ctx.fill()}ctx.globalAlpha=1}
 if(a.state==='walk'||a.state==='pause'){ctx.font='600 11px Inter,sans-serif';const w=ctx.measureText(a.name).width+10;ctx.fillStyle='#07070bcc';rr(a.x-w/2,y+20,w,16,8);ctx.fill();ctx.fillStyle=C.ink;ctx.fillText(a.name,a.x,y+32)}
 if(a.newUntil>now){ctx.fillStyle=C.mag;rr(a.x+9,y-27,32,16,8);ctx.fill();ctx.fillStyle='#000';ctx.font='800 10px Inter,sans-serif';ctx.fillText('Ny!',a.x+25,y-15)}
 ctx.textAlign='left';if(a.card)card(a.card,a.x+14,y-38,col);
 if(a.bubble&&a.bubble.until>now){ctx.font='600 12px Inter,sans-serif';const w=Math.min(260,ctx.measureText(a.bubble.txt).width+20),by=y-(a.card?68:56),bx=Math.max(4,Math.min(VW-w-4,a.x-w/2));ctx.fillStyle=C.ink;rr(bx,by,w,24,12);ctx.fill();ctx.beginPath();ctx.moveTo(a.x-6,by+23);ctx.lineTo(a.x+6,by+23);ctx.lineTo(a.x,by+31);ctx.fill();ctx.fillStyle='#07070b';ctx.textAlign='center';ctx.fillText(fitText(a.bubble.txt,w-16),bx+w/2,by+16);ctx.textAlign='left'}}
function draw(){
 ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#07070b';ctx.fillRect(0,0,cv.width,cv.height);ctx.restore();
 drawFloor();for(const d of desks.values())drawDesk(d);
 const order=[...agents.values()].sort((p,q)=>p.y-q.y);for(const a of order)drawAgent(a);
 for(const f of flights){const k=ease(Math.min(1,f.t)),x=f.x+(f.tx-f.x)*k,y=f.y+(f.ty-f.y)*k-Math.sin(k*Math.PI)*34;ctx.globalAlpha=f.t>1?Math.max(0,1-(f.t-1)/.3):1;card(f.card,x,y,f.col);ctx.globalAlpha=1}
 for(const b of bursts){const k=b.t/2.4;ctx.globalAlpha=Math.max(0,1-k);ctx.font='800 14px Inter,sans-serif';ctx.textAlign='center';ctx.fillStyle=b.col;ctx.fillText(b.label,b.x,b.y-k*50);ctx.textAlign='left';ctx.globalAlpha=1}
 const h=new Date().getHours(),night=h>=19||h<6?.2:0;if(night){ctx.fillStyle='rgba(8,8,40,'+night+')';rr(0,0,VW,VH,18);ctx.fill()}}
function tick(dt){
 for(const a of agents.values()){
  if(a.state==='walk'){a.path.t+=dt;const f=Math.min(1,a.path.t/a.path.dur),p=posOn(a.path,ease(f));a.x=p.x;a.y=p.y;if(!reduce)a.trail.push({x:a.x,y:a.y,t:now});if(f>=1){a.path=null;a.state='idle';const fn=a.then;a.then=null;if(fn)fn();else paintDesk(a)}}
  if(a.trail.length)a.trail=a.trail.filter(p=>now-p.t<1.1);
  if(a.state==='pause'&&now>=a.wait.until){const fn=a.wait.fn;a.wait=null;fn()}}
 for(const f of flights){f.t+=dt*2.2;if(f.t>=1&&!f.landed){f.landed=true;f.done()}}
 for(let i=flights.length-1;i>=0;i--)if(flights[i].t>1.3)flights.splice(i,1);
 for(const b of bursts)b.t+=dt;for(let i=bursts.length-1;i>=0;i--)if(bursts[i].t>2.4)bursts.splice(i,1)}
const tickClock=()=>{const d=new Date();el('clock').textContent=pad(d.getHours())+':'+pad(d.getMinutes())};tickClock();setInterval(tickClock,1000);

/* ---------- data: teamets riktiga händelser ---------- */
fit();{const w=floor.parentElement;w.scrollLeft=(w.scrollWidth-w.clientWidth)/2}
let last=performance.now();
function frame(t){const dt=Math.min(.05,Math.max(0,(t-last)/1000));last=t;now+=dt;tick(dt);draw();requestAnimationFrame(frame)}
requestAnimationFrame(frame);
(async()=>{
 let db=null;try{db=window.claude&&window.claude.use?await window.claude.use('db'):null}catch(e){db=null}
 if(!db){setMode('offline');el('note').textContent='Kunde inte nå teamets data här, så en demo visas.';startDemo();return}
 const seen=new Set();let first=true;
 const timer=setTimeout(()=>{if(first)el('note').textContent='Teamets data svarar inte än, försöker igen…'},10000);
 db.collection('agents').onSnapshot(snap=>{for(const d of snap.docs)if(d.exists)ensureAgent(d.id,d.data()||{},false);for(const a of agents.values())paintDesk(a);refreshMode()},()=>{});
 db.collection('events').orderBy('ts','desc').limit(300).onSnapshot(snap=>{
  if(!snap.metadata.fromCache)clearTimeout(timer);
  const fresh=[];for(const d of snap.docs){if(!d.exists||seen.has(d.id))continue;seen.add(d.id);const e=Object.assign({},d.data());if(typeof e.ts==='number')fresh.push(e)}
  fresh.sort((a,b)=>a.ts-b.ts);for(const e of fresh)apply(e,!first||Date.now()-e.ts<90e3);
  if(first&&!snap.size&&!agents.size)el('note').textContent='Inget i teamets logg än.';
  first=false;refreshMode()},()=>{setMode('offline')});
 setInterval(refreshMode,20e3);
})();
}
